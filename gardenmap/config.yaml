name: GardenMap
version: "0.4.4"
slug: gardenmap
description: Carte et suivi des plantes et arbres du jardin
url: https://github.com/rihooft/gardenmap
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:flower
panel_title: Jardin
homeassistant_api: true
backup: hot
options:
  ai_provider: none
  ai_api_key: ""
  ai_base_url: ""
  ai_model: ""
  photo_max_size: 2000
schema:
  ai_provider: list(none|anthropic|openai)
  ai_api_key: password?
  ai_base_url: str?
  ai_model: str?
  photo_max_size: int(800,4000)
